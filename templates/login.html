{% extends "base.html" %}
{% block title %}Přihlášení · AssistPlanner{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">🗂️ AssistPlanner</h1>
        <form method="post">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <label class="form-label">Přihlásit jako</label>
          <div class="btn-group w-100 mb-3" role="group">
            {% for role in UserRole %}
              <input type="radio" class="btn-check" name="role" id="role-{{ role.name }}" value="{{ role.name }}" {{ 'checked' if loop.first }}>
              <label class="btn btn-outline-primary btn-lg" for="role-{{ role.name }}">{{ role.value }}</label>
            {% endfor %}
          </div>
          <label class="form-label" for="password">Heslo</label>
          <input type="password" class="form-control form-control-lg mb-3" id="password" name="password" autocomplete="current-password">
          <button class="btn btn-primary btn-lg w-100">Přihlásit</button>
        </form>
        {% if passwordless %}
          <p class="small text-warning-emphasis mt-3 mb-0">⚠️ Některá role nemá v <code>.env</code> nastavené heslo – přihlásí se bez hesla.</p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
